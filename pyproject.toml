[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lavatune"
version = "0.1.0a1"
description = "A terminal-native acoustic organism for Linux."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Tucker Vana" }
]
keywords = ["audio", "terminal", "visualizer", "linux", "pipewire", "pulse", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Terminals"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tuckeefro/lavatune"
Repository = "https://github.com/tuckeefro/lavatune.git"
Issues = "https://github.com/tuckeefro/lavatune/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "ruff>=0.12,<1",
  "twine>=6,<7"
]

[project.scripts]
lavatune = "lavatune.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
