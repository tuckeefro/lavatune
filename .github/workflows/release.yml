name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  # A retry for the same tag must replace a stalled attempt instead of
  # waiting behind it indefinitely.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  github-release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release tools
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check --no-input --timeout 30 --retries 2 '.[dev]'
      - name: Verify tag matches package version
        run: |
          VERSION=$(PYTHONPATH=src python -c "from lavatune import __version__; print(__version__)")
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Run release tests
        timeout-minutes: 8
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m build
      - name: Validate distributions
        run: |
          twine check dist/*
          python scripts/verify_dist.py dist
      - name: Test the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/lavatune-release"
          "$RUNNER_TEMP/lavatune-release/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/lavatune-release/bin/lavatune" --help
          "$RUNNER_TEMP/lavatune-release/bin/python" -c "import lavatune; print(lavatune.__version__)"
      - name: Write checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create or update GitHub release
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PRERELEASE=()
          case "$VERSION" in
            *a*|*b*|*rc*) PRERELEASE=(--prerelease) ;;
          esac
          if timeout --signal=TERM --kill-after=10s 60s gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            timeout --signal=TERM --kill-after=10s 180s gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            status=$?
            if [ "$status" -eq 124 ]; then
              echo "Timed out while checking for the existing GitHub release." >&2
              exit 1
            fi
            timeout --signal=TERM --kill-after=10s 180s gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              "${PRERELEASE[@]}"
          fi
