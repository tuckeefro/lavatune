name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github-release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release tools
        run: python -m pip install '.[dev]'
      - name: Verify tag matches package version
        run: |
          VERSION=$(PYTHONPATH=src python -c "from lavatune import __version__; print(__version__)")
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Run release tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m build
      - name: Validate distributions
        run: |
          twine check dist/*
          python scripts/verify_dist.py dist
      - name: Test the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/lavatune-release"
          "$RUNNER_TEMP/lavatune-release/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/lavatune-release/bin/lavatune" --help
          "$RUNNER_TEMP/lavatune-release/bin/python" -c "import lavatune; print(lavatune.__version__)"
      - name: Write checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PRERELEASE=()
          case "$VERSION" in
            *a*|*b*|*rc*) PRERELEASE=(--prerelease) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              "${PRERELEASE[@]}"
          fi
