name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check command entry point
        run: |
          lavatune --help
          lavatune --version
          python -m lavatune --version
      - name: Static doctor smoke test
        shell: bash
        run: |
          set +e
          output="$(lavatune --doctor --no-audio-probe 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 0 -o "$status" -eq 1
          grep -q "Lavatune doctor" <<<"$output"
          grep -q "audio frames: live probe disabled" <<<"$output"

  macos-test:
    name: macOS / Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check command entry point
        run: |
          lavatune --help
          lavatune --version
          python -m lavatune --version
      - name: Static doctor smoke test
        shell: bash
        run: |
          set +e
          output="$(lavatune --doctor --no-audio-probe 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 0 -o "$status" -eq 1
          grep -q "Lavatune doctor" <<<"$output"
          grep -q "audio frames: live probe disabled" <<<"$output"

  quality:
    name: Package quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      - name: Inspect distribution contents
        run: python scripts/verify_dist.py dist
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/lavatune-wheel"
          "$RUNNER_TEMP/lavatune-wheel/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/lavatune-wheel/bin/lavatune" --help
      - name: Smoke-test performance harness
        run: |
          python scripts/benchmark.py --frames 4 --json
          python scripts/benchmark_render.py --frames 4 --json
